[project]
name = "backend"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
    "fastapi",
    "pillow",
    "python-multipart",
    "torch",
    "torchvision",
    "uvicorn",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://pytorch.org"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }